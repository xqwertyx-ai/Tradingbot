name: Portada diaria

on:
  workflow_dispatch:
    inputs:
      evento:
        description: "auto (la revisión que toca), manual (solo regenerar) o una concreta"
        default: "auto"
        required: true
        type: choice
        options: [auto, manual, asia-apertura, asia-cierre, europa-apertura, europa-cierre, usa-apertura, usa-cierre]
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/portada.py", ".github/workflows/portada.yml"]
  # Seis revisiones al día (dashboard/sesiones.py). GitHub retrasa o se salta a menudo los cron
  # programados, así que se comprueba cada media hora: el script decide si toca alguna revisión
  # pendiente y, si no, el trabajo termina en segundos sin hacer nada.
  schedule:
    - cron: "7,37 * * * 1-5"
  workflow_run:               # cierre EE. UU.: justo después del test en vivo PEAD
    workflows: ["Test en vivo PEAD"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      evento: ${{ steps.ev.outputs.evento }}
    steps:
      - uses: actions/checkout@v4

      - name: Qué revisión toca
        id: ev
        env:
          EVENTO: ${{ github.event.inputs.evento || (github.event_name == 'push' && 'manual') || 'auto' }}
        run: |
          if [ "$EVENTO" = auto ]; then EVENTO=$(python3 scripts/evento.py); fi
          # tras el test PEAD se regenera siempre la portada, aunque el cierre ya se hiciera antes
          if [ -z "$EVENTO" ] && [ "${{ github.event_name }}" = workflow_run ]; then EVENTO=manual; fi
          echo "evento=$EVENTO" >> "$GITHUB_OUTPUT"
          echo "Revisión: ${EVENTO:-ninguna pendiente a esta hora}"

      - uses: actions/setup-python@v5
        if: steps.ev.outputs.evento != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.ev.outputs.evento != ''
        run: pip install -r requirements.txt

      - name: Tests
        if: steps.ev.outputs.evento != ''
        run: |
          set -o pipefail
          python -m pytest -q -rA 2>&1 | tee ci.log

      - name: Generar portada
        if: steps.ev.outputs.evento != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENTO: ${{ steps.ev.outputs.evento }}
        run: |
          set -o pipefail
          python scripts/portada.py --evento "$EVENTO" 2>&1 | tee -a ci.log

      - name: Guardar el log del fallo (rama ci-log)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rfq --cached .
          git add -f ci.log
          git commit -qm "Log del fallo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin ci-log

      - name: Preparar la web
        if: steps.ev.outputs.evento != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar en el repo
        if: steps.ev.outputs.evento != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          cp ci.log data/dashboard/ultima-ejecucion.log
          git add README.md assets data/dashboard
          git diff --cached --quiet && exit 0
          git commit -m "Portada $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  web:
    needs: run
    if: needs.run.outputs.evento != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
