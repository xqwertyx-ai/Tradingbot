name: Portada diaria

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "cierre (decide con precios de cierre) o apertura (solo observación)"
        default: "cierre"
        required: true
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/portada.py", ".github/workflows/portada.yml"]
  schedule:
    - cron: "40 6 * * 1-5"    # apertura ~08:40 Madrid (verano)
  workflow_run:               # cierre: justo después del test en vivo PEAD (tras el cierre de Wall Street)
    workflows: ["Test en vivo PEAD"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -rA 2>&1 | tee ci.log

      - name: Generar portada
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '40 6 * * 1-5' && 'apertura') || 'cierre' }}
        run: |
          set -o pipefail
          python scripts/portada.py --modo "$MODO" 2>&1 | tee -a ci.log

      - name: Guardar el log del fallo (rama ci-log)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rfq --cached .
          git add -f ci.log
          git commit -qm "Log del fallo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin ci-log

      - name: Preparar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          cp ci.log data/dashboard/ultima-ejecucion.log
          git add README.md assets data/dashboard
          git diff --cached --quiet && exit 0
          git commit -m "Portada $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  web:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
